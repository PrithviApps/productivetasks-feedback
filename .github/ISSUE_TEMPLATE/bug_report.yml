name: Bug report
description: Report a problem on web, Android or iOS.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "This report is public. Redact screenshots. For private account or security help, email support@productivetasks.com."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Web / PWA, Android, iOS, Multiple platforms]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and device / browser
      placeholder: "App version, OS and device/browser; use unknown if unavailable"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that trigger this problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection when it happened
      options: [Online, Offline, Reconnecting / intermittent, Not sure]
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and context (optional)
      description: Do not upload credentials, private task content or raw logs.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing reports for this problem.
          required: true
        - label: I removed private information from this public report.
          required: true
